# Generate the Xcode project with:  xcodegen generate
# Then open Glassboard.xcodeproj, pick your Team under Signing, and run.
name: Glassboard

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # >>> Change these two to your own values (or set the team in Xcode later) <<<
    BUNDLE_ID_PREFIX: com.example
    DEVELOPMENT_TEAM: ""
    # The App Group both the app and the widgets use to share settings.
    APP_GROUP_ID: group.$(BUNDLE_ID_PREFIX).glassboard
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES

targets:
  Glassboard:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).glassboard
        PRODUCT_NAME: Glassboard
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Glassboard.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: GlassboardWidgets
        embed: true

  GlassboardWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).glassboard.widgets
        PRODUCT_NAME: GlassboardWidgets
        INFOPLIST_FILE: WidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: WidgetExtension/GlassboardWidgets.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
